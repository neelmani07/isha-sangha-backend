# Production settings. Turn on with SPRING_PROFILES_ACTIVE=prod.
# Every secret comes from environment variables; see DEPLOYMENT.md.
spring:
  flyway:
    placeholders:
      removeDemoData: true
  jpa:
    properties:
      hibernate:
        format_sql: false
  datasource:
    hikari:
      # Small pool that closes idle connections, so a free database (e.g. Neon) can sleep between visits.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:0}
      idle-timeout: 120000

server:
  # Behind the host's load balancer: read the visitor's real address from X-Forwarded-For,
  # trusting only private-network proxies (so visitors can't fake it to dodge rate limits).
  # CDN proxies with public addresses (e.g. Cloudflare in front of Render) are handled by app.trusted-proxies below.
  forward-headers-strategy: native
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json

app:
  env: prod
  # Render serves the app through Cloudflare: requests arrive from these ranges (cloudflare.com/ips), and the
  # visitor's real address is read from X-Forwarded-For. Override with TRUSTED_PROXIES on another host.
  trusted-proxies: ${TRUSTED_PROXIES:173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32}
  frontend-origin: ${FRONTEND_ORIGIN:}
  # The live site on Cloudflare Pages, plus its per-deploy preview addresses (e.g. https://53f57e53.isha-sangha-frontend.pages.dev).
  # Accepted alongside FRONTEND_ORIGIN; change EXTRA_ORIGINS if the site moves.
  extra-origins: ${EXTRA_ORIGINS:https://isha-sangha-frontend.pages.dev,https://*.isha-sangha-frontend.pages.dev}
  jwt:
    secret: ${JWT_SECRET:}
  storage:
    type: ${STORAGE_TYPE:s3}
  dev:
    seed-sample-data: false

management:
  endpoint:
    health:
      show-details: never
