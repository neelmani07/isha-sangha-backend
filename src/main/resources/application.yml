spring:
  application:
    name: isha-world-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/isha_world}
    username: ${DB_USERNAME:${USER:postgres}}
    password: ${DB_PASSWORD:}
  data:
    web:
      pageable:
        # Nobody can ask for huge pages (e.g. ?size=100000) and overload the database.
        max-page-size: 200
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    placeholders:
      # true only in production (see application-prod.yml): V13 then removes the V2/V3 demo map data.
      removeDemoData: ${REMOVE_DEMO_DATA:false}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  # Email delivery for sign-in codes. Leave MAIL_HOST unset in dev to log codes to the console.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: ${PORT:8080}

app:
  env: ${APP_ENV:dev}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:change-me}
    expiry-hours: 24
    user-expiry-days: 30
  auth:
    google:
      # OAuth 2.0 Web client ID from Google Cloud Console. Blank disables Google sign-in.
      client-id: ${GOOGLE_CLIENT_ID:}
    otp:
      from: ${OTP_FROM_EMAIL:${app.site.contact-email}}
  # Public identity of the site and the NGO behind it. Rename the site here only.
  site:
    name: ${SITE_NAME:Isha Sangha}
    tagline: ${SITE_TAGLINE:A community of meditators, volunteers and seekers}
    contact-email: ${SITE_CONTACT_EMAIL:hello@example.org}
    organization:
      legal-name: ${ORG_LEGAL_NAME:}
      registration-number: ${ORG_REGISTRATION_NUMBER:}
      tax-exemption: ${ORG_TAX_EXEMPTION:}
      address: ${ORG_ADDRESS:}
    disclaimer: ${SITE_DISCLAIMER:This is an independent volunteer community. It is not affiliated with, endorsed by, or operated by Isha Foundation.}
  admin:
    # First super admin, created once if missing. Leave the password blank after the first start.
    default-email: ${ADMIN_DEFAULT_EMAIL:admin@ishaworld.local}
    default-password: ${ADMIN_DEFAULT_PASSWORD:}
  storage:
    # local = files under UPLOADS_DIR (dev, or a server with a persistent disk); s3 = an S3-compatible bucket.
    type: ${STORAGE_TYPE:local}
    s3:
      # Private bucket. For Cloudflare R2 / DigitalOcean Spaces set the endpoint; for AWS S3 leave it blank.
      bucket: ${STORAGE_BUCKET:}
      region: ${STORAGE_REGION:auto}
      endpoint: ${STORAGE_ENDPOINT:}
      access-key: ${STORAGE_ACCESS_KEY:}
      secret-key: ${STORAGE_SECRET_KEY:}
  uploads:
    # Local storage folder (images/ and proofs/ inside it) when app.storage.type=local.
    dir: ${UPLOADS_DIR:uploads}
  # Preview sample data on a deployed site (DemoContentSeeder): on | remove | off. See DEPLOYMENT.md.
  demo-content: ${DEMO_CONTENT:off}
  dev:
    # Local development only: sample meditators, initiatives and resource links. Never enable in production.
    seed-sample-data: ${SEED_SAMPLE_DATA:${SEED_SAMPLE_MEDITATORS:false}}

management:
  endpoints:
    web:
      exposure:
        include: health,info
